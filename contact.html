<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลติดต่อ - กฤษฎา อ่อนละออ</title>
    
    <!-- ดึงฟอนต์น่ารักๆ (Mitr) จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* พื้นหลังโทนหวานพาสเทล ไล่เฉดสีชมพู-ฟ้าอ่อน */
        body {
            font-family: 'Mitr', 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* กล่องการ์ดข้อมูลสีขาวมนๆ พร้อมเงาสีชมพูฟุ้งๆ */
        .profile-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 35px 28px;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
            text-align: center;
            width: 100%;
            max-width: 380px;
            border: 2px solid #FFF0F5;
            transition: transform 0.3s ease;
        }

        /* เอฟเฟกต์ลอยนิดๆ เวลาเอาม้าสไปชี้ */
        .profile-container:hover {
            transform: translateY(-5px);
        }

        /* ตกแต่งรูปโปรไฟล์วงกลม มีขอบสีชมพูหวาน */
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #FFC6FF;
            box-shadow: 0 5px 15px rgba(255, 198, 255, 0.6);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05) rotate(3deg);
        }

        h2 {
            color: #FF6B8B;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 22px;
        }

        .info-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        /* ตกแต่งรายการข้อมูลให้เป็นกล่องย่อยมนๆ สีนมพาสเทล */
        .info-list li {
            background-color: #FFF5F7;
            margin-bottom: 10px;
            padding: 10px 16px;
            border-radius: 15px;
            color: #5A4A42;
            font-size: 14px;
            border: 1px solid #FFE4E1;
            line-height: 1.6;
        }

        .info-list li strong {
            color: #D87093;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        
        <h2>💖 ข้อมูลติดต่อส่วนตัว 💖</h2>

        <!-- รูปโปรไฟล์ของคุณ -->
        <img src="pp.jpg" alt="รูปโปรไฟล์" class="profile-img">

        <!-- รายการข้อมูล -->
        <ul class="info-list">
            <li><strong>ชื่อ-นามสกุล:</strong> นาย กฤษฎา อ่อนละออ</li>
            <li><strong>ชื่อเล่น:</strong> พรีม</li>
            <li><strong>ระดับชั้น:</strong> ม.4/10 &nbsp;|&nbsp; <strong>เลขที่:</strong> 04</li>
            <li><strong>วัน/เดือน/ปีเกิด:</strong> 1 กันยายน 2553</li>
            <li><strong>อายุ:</strong> 15 ปี</li>
            <li><strong>อีเมล:</strong> kitsadaoonlaoo2@gmail.com</li>
            <li><strong>ไอดี Line:</strong> 0973282700</li>
            <li><strong>เบอร์โทรศัพท์:</strong> 097-328-2700</li>
        </ul>
        
    </div>

</body>
</html>
