<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลติดต่อ - กฤษฎา อ่อนละออ</title>
    
    <!-- ฟอนต์ 'Mitr' จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* พื้นหลังไล่เฉดสี 3 โทนพาสเทล */
        body {
            font-family: 'Mitr', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 45%, #a1c4fd 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }
        
        /* กล่องกระจกใส ขยายกว้างขึ้นสมดุลกับหน้าจอ */
        .profile-container {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 40px 32px;
            border-radius: 32px;
            box-shadow: 0 18px 40px rgba(230, 150, 180, 0.35);
            text-align: center;
            width: 100%;
            max-width: 440px; /* ขยายความกว้างให้ได้สัดส่วนสวยงามพอดี */
            border: 2px solid rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .profile-container:hover {
            transform: translateY(-6px);
            box-shadow: 0 22px 45px rgba(220, 130, 170, 0.42);
        }

        /* กรอบรูปภาพใหญ่ขึ้น ขอบหนาขึ้นสมดุลกับกล่อง */
        .img-wrapper {
            display: inline-block;
            padding: 6px;
            background: linear-gradient(45deg, #ff85a2, #a1c4fd);
            border-radius: 50%;
            box-shadow: 0 8px 22px rgba(255, 133, 162, 0.45);
            margin-bottom: 20px;
        }

        .profile-img {
            width: 150px; /* ปรับรูปภาพให้ใหญ่พอดีกับสัดส่วนกล่องใหม่ */
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 3px solid #ffffff;
        }

        /* หัวข้อขยายใหญ่ขึ้นเล็กน้อย */
        h2 {
            background: linear-gradient(45deg, #ff6b8b, #8e7cc3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            margin-bottom: 24px;
            font-weight: 500;
            font-size: 25px;
        }

        .info-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        /* เพิ่มพื้นที่ภายในแถวข้อมูลให้อ่านสบายตาขึ้น */
        .info-list li {
            background: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
            padding: 12px 20px; /* ระยะห่างในกล่องย่อยกำลังดี */
            border-radius: 18px;
            color: #4a4a4a;
            font-size: 15px; /* ปรับขนาดตัวอักษรขึ้นเป็น 15px */
            border: 1px solid rgba(255, 255, 255, 0.85);
            line-height: 1.6;
            backdrop-filter: blur(5px);
        }

        .info-list li strong {
            color: #d8527c;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        
        <h2>✨ ข้อมูลติดต่อส่วนตัว ✨</h2>

        <div class="img-wrapper">
            <img src="pp.jpg" alt="รูปโปรไฟล์" class="profile-img">
        </div>

        <ul class="info-list">
            <li><strong>ชื่อ-นามสกุล:</strong> นาย กฤษฎา อ่อนละออ</li>
            <li><strong>ชื่อเล่น:</strong> พรีม</li>
            <li><strong>ระดับชั้น:</strong> ม.4/10 &nbsp;|&nbsp; <strong>เลขที่:</strong> 04</li>
            <li><strong>วัน/เดือน/ปีเกิด:</strong> 1 กันยายน 2553</li>
            <li><strong>อายุ:</strong> 15 ปี</li>
            <li><strong>อีเมล:</strong> kitsadaoonlaoo2@gmail.com</li>
            <li><strong>ไอดี Line:</strong> 0973282700</li>
            <li><strong>เบอร์โทรศัพท์:</strong> 097-328-2700</li>
        </ul>
        
    </div>

</body>
</html>
